<div class="container">
    <h2>Registrar cuenta</h2>

    <form [formGroup]="form" (ngSubmit)="guardar()"> 

    <div class="form-group"> 

      <label>Número de Cuenta</label> 

      <input type="text" formControlName="numeroCuenta" /> 

      <div *ngIf="form.get('numeroCuenta')?.invalid && form.get('numeroCuenta')?.touched"> 

        El número de cuenta es obligatorio y debe tener al menos 10 caracteres. 

      </div> 

    </div> 

 

    <div class="form-group"> 

      <label>Tipo de Cuenta</label> 

      <select formControlName="tipoCuenta"> 

        <option value="">Seleccione</option> 

        <option value="AHORROS">Ahorros</option> 

        <option value="CORRIENTE">Corriente</option> 

      </select> 

    </div> 

 

    <div class="form-group"> 

      <label>Saldo Inicial</label> 

      <input type="number" formControlName="saldoInicial" /> 

    </div> 

 

    <div class="form-group"> 

      <label>Estado</label> 

      <select formControlName="estado"> 

        <option [value]="true">Activo</option> 

        <option [value]="false">Inactivo</option> 

      </select> 

    </div> 

 

    <div class="form-group"> 

      <label>Cliente</label> 

      <select formControlName="clienteId"> 

        <option value="">Seleccione un cliente</option> 

        <option *ngFor="let c of clientes" [value]="c.id">{{ c.nombre }}</option> 

      </select> 

    </div> 

 

    <div class="form-group"> 

      <button type="submit">Guardar</button> 

    </div> 

  </form> 

</div>
